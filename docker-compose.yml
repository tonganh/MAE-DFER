services:
  api:
    build:
      context: .
      args:
        PYTORCH_INDEX: ${PYTORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CHECKPOINT_PATH: ${CHECKPOINT_PATH:-/models/finetuning/dfew/dfrew_fold05/checkpoint_dfew_fold5.pth}
      DEVICE: ${DEVICE:-cpu}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WS_MAX_SIZE: ${WS_MAX_SIZE:-52428800}
      STREAM_SEGMENT_SEC: ${STREAM_SEGMENT_SEC:-10}
      API_SAVE_DIR: /data/api_saved
    volumes:
      - ${CHECKPOINT_DIR:-./saved/model}:/models:ro
      - ${API_SAVE_HOST_DIR:-./api_saved}:/data/api_saved[]
