[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mae-dfer"
version = "1.0.0"
description = "Efficient Masked Autoencoder for Self-supervised Dynamic Facial Expression Recognition"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mae_dfer*"]
